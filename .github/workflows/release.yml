name: Release

# Push a tag like v0.1.0 to build Tack.app and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: swift test
      - name: Build the app (universal)
        run: ./build.sh universal
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ditto -c -k --keepParent build/Tack.app "Tack-${TAG#v}.zip"
          shasum -a 256 Tack-*.zip > SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Tack ${TAG#v}" --notes "$notes"
          gh release upload "$TAG" Tack-*.zip SHA256SUMS.txt --clobber
