name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tack version or commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Writing style
      options: [Simple, Markdown]
